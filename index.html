<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PigeonFeed" />
    <meta name="theme-color" content="#e8f6f9" />
    <script>
      // The theme before the first paint (the switch in the top bar changes it).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('pigeonfeed:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b2430');
      })();
    </script>
    <title>PigeonFeed</title>
    <meta name="description" content="A peer-to-peer social feed in your browser. Post, add friends and send private messages, with no account needed." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PigeonFeed" />
    <meta property="og:title" content="PigeonFeed" />
    <meta property="og:description" content="A peer-to-peer social feed in your browser. Post, add friends and send private messages, with no account needed." />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
